# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:wendysdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (opcional): http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Muy importante para la demostracion: ver el SQL que genera Hibernate
# Asi se nota EXACTAMENTE cuando se dispara un SELECT extra por un LAZY
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Sugerido: evita que Spring abra sesion durante toda la request,
# asi el LAZY realmente falla fuera de una transaccion (mas honesto para la demo)
spring.jpa.open-in-view=false
